[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-engineering-harness"
version = "0.1.0"
description = "Bounded multi-agent autonomous software engineering harness using OpenRouter"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
treesitter = ["tree-sitter>=0.23,<1", "tree-sitter-python>=0.23,<1"]
dev = ["pytest>=8,<9"]

[project.scripts]
aeh = "harness.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["harness"]
