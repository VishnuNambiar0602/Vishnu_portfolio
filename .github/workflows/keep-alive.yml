name: Keep Render API awake

# Render's free web services go to sleep after about 15 minutes without traffic. This pings the API's
# /health endpoint every 10 minutes so the first real visitor does not wait for a cold start.
# It does nothing until you set the repository variable RENDER_URL (Settings, Secrets and variables,
# Actions, Variables), for example https://medical-xai-api.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    steps:
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 "${{ vars.RENDER_URL }}/health"; then echo; exit 0; fi
            echo "attempt $attempt failed, retrying in 20s"; sleep 20
          done
          echo "The API did not answer after 3 attempts"; exit 1
