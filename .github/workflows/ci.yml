name: Tests
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Deployment is handled by Vercel (site, teaching site) and Render (API), which build from this repository.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  medical-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
        working-directory: backend/medical-xai/Medical-XAI/backend
      - run: pytest -q test_api.py
        working-directory: backend/medical-xai/Medical-XAI/backend

  tiny-lm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pyyaml pytest hypothesis
      - run: pytest -q
        working-directory: backend/tiny-lm

  tiny-lm-educator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: backend/tiny-lm/educator
      - run: npm test
        working-directory: backend/tiny-lm/educator
      - run: npm run build
        working-directory: backend/tiny-lm/educator

  forecasting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
        working-directory: backend/restaurant-forecasting
      - run: pytest -q
        working-directory: backend/restaurant-forecasting

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: pip install -e ".[dev]"
        working-directory: backend/autonomous-engineering-harness
      - run: pytest -q
        working-directory: backend/autonomous-engineering-harness

  mlops-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: backend/mlops-agent
      - run: npm run build && npm test
        working-directory: backend/mlops-agent
