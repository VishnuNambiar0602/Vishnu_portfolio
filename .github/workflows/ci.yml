name: Test and deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  forecasting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
        working-directory: backend/restaurant-forecasting
      - run: pytest -q
        working-directory: backend/restaurant-forecasting

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: pip install -e ".[dev]"
        working-directory: backend/autonomous-engineering-harness
      - run: pytest -q
        working-directory: backend/autonomous-engineering-harness

  mlops-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: backend/mlops-agent
      - run: npm run build && npm test
        working-directory: backend/mlops-agent

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, forecasting, harness, mlops-agent]
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf frontend/node_modules frontend/scripts frontend/tests frontend/package.json frontend/package-lock.json frontend/DESIGN.md frontend/README.md
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend }
      - id: deploy
        uses: actions/deploy-pages@v4
